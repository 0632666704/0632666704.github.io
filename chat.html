<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUMAI-SA Super AI</title>
<style>
*{box-sizing:border-box} body{font-family:sans-serif;margin:0;height:100vh;display:flex;flex-direction:column;background:#fff}
header{background:#000;color:#00E5FF;padding:10px;text-align:center;font-weight:900}
#bar2{display:flex;gap:5px;padding:6px;background:#111}
select{flex:1;padding:8px;border-radius:20px;border:1px solid #333;background:#222;color:#fff}
#tools{display:flex;gap:5px;overflow:auto;padding:6px;background:#222}
#tools button{padding:6px 10px;border-radius:20px;border:1px solid #444;background:#333;color:#fff;font-size:11px;white-space:nowrap}
#tools button.active{background:#00E5FF;color:#000}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:16px;max-width:90%;line-height:1.5;white-space:pre-wrap;font-size:14px}
.user{align-self:flex-end;background:#000;color:#00E5FF}
.bot{align-self:flex-start;background:#f3f4f6;border:1px solid #e5e7eb}
.msg img{max-width:100%;border-radius:12px;margin-top:8px}
#bar{display:flex;padding:8px;gap:5px;border-top:1px solid #eee;align-items:center}
input{flex:1;padding:11px 14px;border:1px solid #ddd;border-radius:24px}
button.icon{width:42px;height:42px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:16px}
button.send{background:#000;color:#00E5FF;border:0;padding:10px 16px;border-radius:24px;font-weight:800}
#preview{display:none;padding:6px;background:#f9f9f9;gap:6px;align-items:center}
#preview img{height:50px;border-radius:6px}
</style>
</head>
<body>
<header>🔥 TUMAI-SA — All Languages + All AI + Voice</header>
<div id="bar2">
<select id="langSel">
<option value="en">🇬🇧 English</option>
<option value="st">🇿🇦 Sesotho</option>
<option value="zu">🇿🇦 Zulu</option>
<option value="af">🇿🇦 Afrikaans</option>
<option value="nso">🇿🇦 Sepedi</option>
<option value="tn">🇿🇦 Setswana</option>
<option value="fa">🇮🇷 فارسی</option>
<option value="ar">🇸🇦 عربي</option>
<option value="fr">🇫🇷 Français</option>
<option value="es">🇪🇸 Español</option>
<option value="tr">🇹🇷 Türkçe</option>
<option value="hi">🇮🇳 हिन्दी</option>
<option value="zh">🇨🇳 中文</option>
</select>
</div>
<div id="tools">
<button onclick="setMode('auto')" class="active" id="m-auto">🤖 Auto</button>
<button onclick="setMode('homework')" id="m-homework">📚 Homework</button>
<button onclick="setMode('post')" id="m-post">📱 Post</button>
<button onclick="setMode('image')" id="m-image">🎨 Image</button>
<button onclick="setMode('code')" id="m-code">💻 Code</button>
<button onclick="setMode('essay')" id="m-essay">✍️ Essay</button>
</div>
<div id="chat"><div class="msg bot">🚀 TUMAI-SA READY!

🌍 All Languages
📚 Homework + Math
📱 Viral Posts
🎨 Make Images
💻 Code + Essays
🖼️ See Pictures
🎙️ Voice

Just ask in ANY language!</div></div>
<div id="preview"><img id="prevImg"><button onclick="clearImg()">❌</button></div>
<div id="bar">
<button class="icon" onclick="document.getElementById('fileImg').click()">🖼️</button>
<button class="icon" id="micBtn" onclick="toggleVoice()">🎙️</button>
<input id="q" placeholder="Any language... anything...">
<button class="send" onclick="ask()">Send</button>
</div>
<input type="file" id="fileImg" accept="image/*" hidden>
<script>
let LANG='en'; let MODE='auto'; let IMG=null;
let recognition=null; let recognizing=false;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.continuous=false;
  recognition.onstart=()=>{recognizing=true; document.getElementById('micBtn').textContent='🔴';};
  recognition.onend=()=>{recognizing=false; document.getElementById('micBtn').textContent='🎙️';};
  recognition.onresult=(e)=>{document.getElementById('q').value=e.results[0][0].transcript;};
}
function toggleVoice(){
  if(!recognition){alert('Use Chrome for voice');return;}
  recognition.lang=document.getElementById('langSel').value;
  if(recognizing) recognition.stop(); else recognition.start();
}
function speak(t){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t.slice(0,300));
  u.lang=document.getElementById('langSel').value;
  speechSynthesis.speak(u);
}
function setMode(m){MODE=m; document.querySelectorAll('#tools button').forEach(b=>b.classList.remove('active')); document.getElementById('m-'+m).classList.add('active');}
function clearImg(){IMG=null; document.getElementById('preview').style.display='none';}
document.getElementById('fileImg').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{IMG=ev.target.result; document.getElementById('prevImg').src=IMG; document.getElementById('preview').style.display='flex';}; r.readAsDataURL(f);});
async function ask(){
  const input=document.getElementById('q'); const text=input.value.trim(); if(!text && !IMG) return;
  add(text||"📸",'user'); input.value=''; const imgSend=IMG; const hasImg=!!IMG; clearImg();
  const langText=document.getElementById('langSel').options[document.getElementById('langSel').selectedIndex].text;
  add('Thinking...','bot');
  try{
    if(MODE==='image' || /create image|تصویر|setshwantsho/i.test(text)){
      let prompt=text.replace(/create image of|تصویر بساز/i,'').trim()||text;
      const url="https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt+" detailed 8k")+"?width=768&height=768&nologo=true&seed="+Math.floor(Math.random()*10000);
      document.querySelector("#chat .msg.bot:last-child").remove();
      addHTML("🎨 "+prompt+"<br><img src='"+url+"'><br><button onclick='speak(`"+prompt.replace(/'/g,'')+"`)'>🔊 Listen</button>",'bot'); return;
    }
    let system=`You are TUMAI-SA by Itumeleng Maphakisa. Reply in ${langText} language ${LANG}. MODE=${MODE}. Do everything: homework step-by-step, viral posts with hashtags, code, essays, math.`;
    let messages=[{role:"system",content:system}];
    if(hasImg) messages.push({role:"user",content:[{type:"text",text:text||"Explain this image"}, {type:"image_url",image_url:{url:imgSend}}]});
    else messages.push({role:"user",content:text});
    const r=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages})});
    const d=await r.json();
    document.querySelector("#chat .msg.bot:last-child").remove();
    const ans=d.choices[0].message.content;
    addHTML(ans+"<br><button onclick='speak(`"+ans.replace(/`/g,'').replace(/'/g,'').slice(0,300)+"`)'>🔊 Listen</button>",'bot');
  }catch(e){document.querySelector("#chat .msg.bot:last-child").remove(); add("Error: "+e.message,'bot');}
}
function add(t,c){ const d=document.createElement('div'); d.className='msg '+c; d.textContent=t; document.getElementById('chat').appendChild(d); document.getElementById('chat').scrollTop=999999; }
function addHTML(t,c){ const d=document.createElement('div'); d.className='msg '+c; d.innerHTML=t; document.getElementById('chat').appendChild(d); document.getElementById('chat').scrollTop=999999; }
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script>
</body>
</html>
