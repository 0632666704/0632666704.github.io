<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUMAI-SA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00E5FF">
<link rel="apple-touch-icon" href="icon-1024.jpg">
<style>body{margin:0;background:#000A14;color:#E0F7FF;font-family:system-ui;display:flex;flex-direction:column;height:100vh}header{padding:16px;text-align:center;border-bottom:1px solid #00E5FF33;background:#001525}h1{margin:0;color:#00E5FF}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.b{padding:12px;border-radius:16px;max-width:85%}.u{background:#00E5FF;color:#000;align-self:flex-end}.bot{background:#102030;border:1px solid #00E5FF44;align-self:flex-start}#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #00E5FF33;background:#001525}input{flex:1;padding:14px;border-radius:24px;border:1px solid #00E5FF55;background:#0A1A2A;color:#fff}button{padding:14px 22px;border-radius:24px;border:0;background:#00E5FF;color:#001525;font-weight:800}</style>
</head><body>
<header><h1>TUMAI</h1><small>Steynsrus 9515 • By Itumeleng Maphakisa</small></header>
<div id="chat"><div class="b bot">Sawubona! I am TUMAI-SA from 9515. What shall we build? 🇿🇦</div></div>
<div id="bar"><input id="q" placeholder="Ask TUMAI..."><button onclick="send()">SEND</button></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
async function send(){let i=document.getElementById('q'),c=document.getElementById('chat'),t=i.value.trim();if(!t)return;c.innerHTML+=`<div class=b u>${t}</div>`;i.value='';let id='t'+Date.now();c.innerHTML+=`<div class="b bot" id="${id}">Thinking...</div>`;try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t+' You are TUMAI-SA from Steynsrus 9515'));let a=await r.text();document.getElementById(id).innerHTML=a}catch(e){document.getElementById(id).innerHTML='Offline ready'}c.scrollTop=c.scrollHeight}
</script>
</body></html>
