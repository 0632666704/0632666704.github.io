<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>TUMAI - Student Platform</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192x192.png">
  <link rel="apple-touch-icon" href="icon-512x512.png">
  <style>
    body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; }
    h1 { color:#00E5FF; font-size:48px; }
    img { width:200px; height:200px; border-radius:30px; }
    button { background:#00E5FF; color:#000; padding:15px 30px; border:none; border-radius:12px; font-size:18px; font-weight:bold; margin-top:20px; }
  </style>
</head>
<body>
  <img src="icon-512x512.png" alt="TUMAI">
  <h1>TUMAI</h1>
  <p>Student Platform</p>
  <button onclick="location.reload()">Launch App</button>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
