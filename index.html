<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;background:#000;color:#fff}
header{background:#000;color:#00E5FF;padding:14px;text-align:center;font-weight:900;font-size:18px;border-bottom:2px solid #00E5FF;letter-spacing:1px}
#langBar{padding:8px;background:#111;display:flex}
#langBar select{flex:1;padding:10px;border-radius:20px;border:1px solid #00E5FF;background:#222;color:#fff;font-size:14px}
#tools{display:flex;gap:6px;padding:8px;background:#1a1a1a;overflow-x:auto}
#tools button{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid #333;background:#2a2a2a;color:#fff;font-size:12px;cursor:pointer}
#tools button.active{background:#00E5FF;color:#000;font-weight:800;border-color:#00E5FF}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#ffffff;color:#000}
.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.5;font-size:14px;word-wrap:break-word;white-space:pre-wrap}
.user{align-self:flex-end;background:#000;color:#00E5FF;border:1px solid #00E5FF}
.bot{align-self:flex-start;background:#f1f5f9;color:#000;border:1px solid #e2e8f0}
.msg img{width:100%;max-width:320px;border-radius:12px;margin-top:10px;display:block}
#preview{display:none;padding:8px;background:#111;align-items:center;gap:10px}
#preview img{height:60px;border-radius:8px}
#bar{display:flex;gap:8px;padding:10px;background:#000;border-top:2px solid #00E5FF;align-items:center}
#bar input{flex:1;padding:13px 16px;border-radius:24px;border:1px solid #00E5FF;background:#111;color:#fff;font-size:15px;outline:none}
#bar button.icon{width:44px;height:44px;border-radius:50%;border:1px solid #00E5FF;background:#222;color:#00E5FF;font-size:18px;cursor:pointer;flex-shrink:0}
#bar button.send{background:#00E5FF;color:#000;border:0;padding:12px 20px;border-radius:24px;font-weight:900;font-size:14px;cursor:pointer;flex-shrink:0}
</style>
